<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kona Sound Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: white;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #8B5CF6 0%, #A855F7 50%, #EC4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #888;
      margin-bottom: 2rem;
    }
    button {
      padding: 1rem 3rem;
      font-size: 1.2rem;
      font-weight: bold;
      color: white;
      background: linear-gradient(135deg, #8B5CF6 0%, #A855F7 100%);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 30px rgba(139, 92, 246, 0.5);
    }
    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 50px rgba(139, 92, 246, 0.8);
    }
    button:active {
      transform: scale(0.98);
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 2rem;
    }
    .option-btn {
      padding: 0.8rem 2rem;
      font-size: 1rem;
      background: rgba(139, 92, 246, 0.2);
      border: 1px solid rgba(139, 92, 246, 0.5);
    }
    .label {
      font-size: 0.8rem;
      color: #666;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <h1>KONA</h1>
  <p>Click to hear the signature sound</p>
  
  <button onclick="playKonaSound()">
    🔊 Play Signature Sound
  </button>

  <div class="options">
    <button class="option-btn" onclick="playNetflixStyle()">
      Option 1: Netflix Style (Ta-Dum)
    </button>
    <button class="option-btn" onclick="playDeepBass()">
      Option 2: Deep Bass Hit
    </button>
    <button class="option-btn" onclick="playChime()">
      Option 3: Bright Chime
    </button>
  </div>

  <script>
    // Main Kona sound - Netflix-inspired "Ta-Dum"
    function playKonaSound() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      
      // First hit - "Ta" (lower tone)
      const osc1 = ctx.createOscillator();
      const gain1 = ctx.createGain();
      osc1.connect(gain1);
      gain1.connect(ctx.destination);
      osc1.frequency.setValueAtTime(185, ctx.currentTime);
      osc1.frequency.exponentialRampToValueAtTime(110, ctx.currentTime + 0.2);
      gain1.gain.setValueAtTime(0.5, ctx.currentTime);
      gain1.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
      osc1.start(ctx.currentTime);
      osc1.stop(ctx.currentTime + 0.4);

      // Second hit - "Dum" (higher, sustained)
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.connect(gain2);
      gain2.connect(ctx.destination);
      osc2.type = 'triangle';
      osc2.frequency.setValueAtTime(295, ctx.currentTime + 0.18);
      osc2.frequency.exponentialRampToValueAtTime(220, ctx.currentTime + 0.8);
      gain2.gain.setValueAtTime(0, ctx.currentTime);
      gain2.gain.setValueAtTime(0.6, ctx.currentTime + 0.18);
      gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.5);
      osc2.start(ctx.currentTime + 0.18);
      osc2.stop(ctx.currentTime + 1.5);

      // Bass undertone
      const osc3 = ctx.createOscillator();
      const gain3 = ctx.createGain();
      osc3.connect(gain3);
      gain3.connect(ctx.destination);
      osc3.type = 'sine';
      osc3.frequency.setValueAtTime(55, ctx.currentTime + 0.18);
      gain3.gain.setValueAtTime(0, ctx.currentTime);
      gain3.gain.setValueAtTime(0.4, ctx.currentTime + 0.18);
      gain3.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 2);
      osc3.start(ctx.currentTime + 0.18);
      osc3.stop(ctx.currentTime + 2);
    }

    // Option 1: Netflix style
    function playNetflixStyle() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      
      // Deep boom
      const osc1 = ctx.createOscillator();
      const gain1 = ctx.createGain();
      osc1.connect(gain1);
      gain1.connect(ctx.destination);
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(80, ctx.currentTime);
      osc1.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.5);
      gain1.gain.setValueAtTime(0.7, ctx.currentTime);
      gain1.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.8);
      osc1.start(ctx.currentTime);
      osc1.stop(ctx.currentTime + 0.8);

      // High accent
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.connect(gain2);
      gain2.connect(ctx.destination);
      osc2.type = 'triangle';
      osc2.frequency.setValueAtTime(440, ctx.currentTime + 0.1);
      osc2.frequency.exponentialRampToValueAtTime(330, ctx.currentTime + 0.6);
      gain2.gain.setValueAtTime(0, ctx.currentTime);
      gain2.gain.setValueAtTime(0.3, ctx.currentTime + 0.1);
      gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.2);
      osc2.start(ctx.currentTime + 0.1);
      osc2.stop(ctx.currentTime + 1.2);
    }

    // Option 2: Deep bass hit
    function playDeepBass() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      
      // Very deep bass
      const osc1 = ctx.createOscillator();
      const gain1 = ctx.createGain();
      osc1.connect(gain1);
      gain1.connect(ctx.destination);
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(60, ctx.currentTime);
      osc1.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 1);
      gain1.gain.setValueAtTime(0.8, ctx.currentTime);
      gain1.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.5);
      osc1.start(ctx.currentTime);
      osc1.stop(ctx.currentTime + 1.5);

      // Sub-bass rumble
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.connect(gain2);
      gain2.connect(ctx.destination);
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(35, ctx.currentTime);
      gain2.gain.setValueAtTime(0.5, ctx.currentTime);
      gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 2);
      osc2.start(ctx.currentTime);
      osc2.stop(ctx.currentTime + 2);
    }

    // Option 3: Bright chime
    function playChime() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      
      // Main chime
      const frequencies = [523, 659, 784, 1047]; // C5, E5, G5, C6
      
      frequencies.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.08);
        gain.gain.setValueAtTime(0, ctx.currentTime);
        gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.08 + 1);
        osc.start(ctx.currentTime + i * 0.08);
        osc.stop(ctx.currentTime + i * 0.08 + 1);
      });

      // Bass foundation
      const bassOsc = ctx.createOscillator();
      const bassGain = ctx.createGain();
      bassOsc.connect(bassGain);
      bassGain.connect(ctx.destination);
      bassOsc.type = 'sine';
      bassOsc.frequency.setValueAtTime(130, ctx.currentTime);
      bassGain.gain.setValueAtTime(0.4, ctx.currentTime);
      bassGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.5);
      bassOsc.start(ctx.currentTime);
      bassOsc.stop(ctx.currentTime + 1.5);
    }
  </script>
</body>
</html>
