<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kona Sound Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
      padding: 2rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: white;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      font-size: 2.5rem;
      text-align: center;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #8B5CF6 0%, #A855F7 50%, #EC4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 2rem;
    }
    .section {
      margin-bottom: 2rem;
    }
    .section-title {
      font-size: 1rem;
      color: #A855F7;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
    }
    .sound-btn {
      padding: 1.2rem 1.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: white;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
    }
    .sound-btn:hover {
      background: rgba(139, 92, 246, 0.3);
      border-color: rgba(139, 92, 246, 0.6);
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(139, 92, 246, 0.2);
    }
    .sound-btn:active {
      transform: translateY(0);
    }
    .sound-btn .icon {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      display: block;
    }
    .sound-btn .name {
      display: block;
      margin-bottom: 0.3rem;
    }
    .sound-btn .desc {
      font-size: 0.75rem;
      color: #888;
      font-weight: normal;
    }
    .featured {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.3) 0%, rgba(168, 85, 247, 0.2) 100%);
      border-color: #8B5CF6;
    }
    .footer {
      text-align: center;
      margin-top: 3rem;
      color: #666;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>KONA</h1>
    <p class="subtitle">Choose your signature sound</p>

    <div class="section">
      <div class="section-title">🎬 Cinematic</div>
      <div class="grid">
        <button class="sound-btn featured" onclick="playNetflixTaDum()">
          <span class="icon">🎵</span>
          <span class="name">Netflix Ta-Dum</span>
          <span class="desc">Classic two-note dramatic hit</span>
        </button>
        <button class="sound-btn" onclick="playHBOStatic()">
          <span class="icon">📺</span>
          <span class="name">HBO Style</span>
          <span class="desc">Static noise into angelic choir</span>
        </button>
        <button class="sound-btn" onclick="playInception()">
          <span class="icon">🌀</span>
          <span class="name">Inception Horn</span>
          <span class="desc">Deep brass BWAAAH</span>
        </button>
        <button class="sound-btn" onclick="playCinematicRise()">
          <span class="icon">🎭</span>
          <span class="name">Cinematic Rise</span>
          <span class="desc">Building tension release</span>
        </button>
      </div>
    </div>

    <div class="section">
      <div class="section-title">🌍 African Inspired</div>
      <div class="grid">
        <button class="sound-btn" onclick="playAfricanDrum()">
          <span class="icon">🥁</span>
          <span class="name">Tribal Drums</span>
          <span class="desc">Rhythmic African percussion</span>
        </button>
        <button class="sound-btn" onclick="playKalimba()">
          <span class="icon">🎹</span>
          <span class="name">Kalimba Melody</span>
          <span class="desc">Sweet thumb piano notes</span>
        </button>
        <button class="sound-btn" onclick="playAfricanChant()">
          <span class="icon">🗣️</span>
          <span class="name">Vocal Chant</span>
          <span class="desc">Ethereal African vocals</span>
        </button>
        <button class="sound-btn" onclick="playDjembeDrop()">
          <span class="icon">💫</span>
          <span class="name">Djembe Drop</span>
          <span class="desc">Powerful drum with reverb</span>
        </button>
      </div>
    </div>

    <div class="section">
      <div class="section-title">🎧 Modern / Tech</div>
      <div class="grid">
        <button class="sound-btn" onclick="playSynthWave()">
          <span class="icon">🌊</span>
          <span class="name">Synth Wave</span>
          <span class="desc">Retro electronic pulse</span>
        </button>
        <button class="sound-btn" onclick="playDigitalPulse()">
          <span class="icon">💜</span>
          <span class="name">Digital Pulse</span>
          <span class="desc">Futuristic heartbeat</span>
        </button>
        <button class="sound-btn" onclick="playGlitchDrop()">
          <span class="icon">⚡</span>
          <span class="name">Glitch Drop</span>
          <span class="desc">Electronic stutter bass</span>
        </button>
        <button class="sound-btn" onclick="playWhoosh()">
          <span class="icon">💨</span>
          <span class="name">Whoosh Impact</span>
          <span class="desc">Fast sweep into hit</span>
        </button>
      </div>
    </div>

    <div class="section">
      <div class="section-title">🎼 Musical</div>
      <div class="grid">
        <button class="sound-btn" onclick="playPianoChord()">
          <span class="icon">🎹</span>
          <span class="name">Piano Chord</span>
          <span class="desc">Warm emotional chord</span>
        </button>
        <button class="sound-btn" onclick="playOrchestralHit()">
          <span class="icon">🎻</span>
          <span class="name">Orchestral Hit</span>
          <span class="desc">Full orchestra stab</span>
        </button>
        <button class="sound-btn" onclick="playBrightChime()">
          <span class="icon">✨</span>
          <span class="name">Magic Chime</span>
          <span class="desc">Sparkling bell ascent</span>
        </button>
        <button class="sound-btn" onclick="playEpicBrass()">
          <span class="icon">🎺</span>
          <span class="name">Epic Brass</span>
          <span class="desc">Triumphant horn fanfare</span>
        </button>
      </div>
    </div>

    <div class="section">
      <div class="section-title">🔊 Minimal / Clean</div>
      <div class="grid">
        <button class="sound-btn" onclick="playMinimalPop()">
          <span class="icon">⭕</span>
          <span class="name">Minimal Pop</span>
          <span class="desc">Single satisfying click</span>
        </button>
        <button class="sound-btn" onclick="playSubDrop()">
          <span class="icon">🔈</span>
          <span class="name">Sub Drop</span>
          <span class="desc">Deep bass that you feel</span>
        </button>
        <button class="sound-btn" onclick="playSoftGong()">
          <span class="icon">🔔</span>
          <span class="name">Soft Gong</span>
          <span class="desc">Gentle resonating tone</span>
        </button>
        <button class="sound-btn" onclick="playHeartbeat()">
          <span class="icon">💓</span>
          <span class="name">Heartbeat</span>
          <span class="desc">Two-beat pulse of life</span>
        </button>
      </div>
    </div>

    <p class="footer">Click any button to preview • Tell me which one you like!</p>
  </div>

  <script>
    // Helper to create audio context
    const getCtx = () => new (window.AudioContext || window.webkitAudioContext)();

    // ========== CINEMATIC ==========
    
    function playNetflixTaDum() {
      const ctx = getCtx();
      // First note - deep
      const osc1 = ctx.createOscillator();
      const gain1 = ctx.createGain();
      osc1.connect(gain1);
      gain1.connect(ctx.destination);
      osc1.frequency.setValueAtTime(185, ctx.currentTime);
      osc1.frequency.exponentialRampToValueAtTime(110, ctx.currentTime + 0.2);
      gain1.gain.setValueAtTime(0.6, ctx.currentTime);
      gain1.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
      osc1.start(ctx.currentTime);
      osc1.stop(ctx.currentTime + 0.5);

      // Second note - higher
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.connect(gain2);
      gain2.connect(ctx.destination);
      osc2.type = 'triangle';
      osc2.frequency.setValueAtTime(295, ctx.currentTime + 0.2);
      osc2.frequency.exponentialRampToValueAtTime(220, ctx.currentTime + 1);
      gain2.gain.setValueAtTime(0, ctx.currentTime);
      gain2.gain.setValueAtTime(0.5, ctx.currentTime + 0.2);
      gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.8);
      osc2.start(ctx.currentTime + 0.2);
      osc2.stop(ctx.currentTime + 1.8);

      // Bass
      const bass = ctx.createOscillator();
      const bassGain = ctx.createGain();
      bass.connect(bassGain);
      bassGain.connect(ctx.destination);
      bass.frequency.setValueAtTime(55, ctx.currentTime + 0.2);
      bassGain.gain.setValueAtTime(0, ctx.currentTime);
      bassGain.gain.setValueAtTime(0.4, ctx.currentTime + 0.2);
      bassGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 2);
      bass.start(ctx.currentTime + 0.2);
      bass.stop(ctx.currentTime + 2);
    }

    function playHBOStatic() {
      const ctx = getCtx();
      const duration = 2;
      
      // White noise (static)
      const bufferSize = ctx.sampleRate * 0.5;
      const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }
      const noise = ctx.createBufferSource();
      noise.buffer = noiseBuffer;
      const noiseGain = ctx.createGain();
      noise.connect(noiseGain);
      noiseGain.connect(ctx.destination);
      noiseGain.gain.setValueAtTime(0.3, ctx.currentTime);
      noiseGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
      noise.start(ctx.currentTime);

      // Choir-like tone
      [261, 329, 392, 523].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime + 0.4);
        gain.gain.setValueAtTime(0, ctx.currentTime);
        gain.gain.setValueAtTime(0.15, ctx.currentTime + 0.4);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 2);
        osc.start(ctx.currentTime + 0.4);
        osc.stop(ctx.currentTime + 2);
      });
    }

    function playInception() {
      const ctx = getCtx();
      // BWAAAH - low brass
      [55, 110, 165, 220].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq * 0.8, ctx.currentTime + 1.5);
        gain.gain.setValueAtTime(0, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.15, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, ctx.currentTime + 0.8);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 2);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 2);
      });
    }

    function playCinematicRise() {
      const ctx = getCtx();
      // Rising tone
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(100, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 1);
      osc.frequency.setValueAtTime(200, ctx.currentTime + 1);
      gain.gain.setValueAtTime(0.01, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 1);
      gain.gain.setValueAtTime(0.5, ctx.currentTime + 1);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 2);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 2);

      // Impact
      const impact = ctx.createOscillator();
      const impactGain = ctx.createGain();
      impact.connect(impactGain);
      impactGain.connect(ctx.destination);
      impact.frequency.setValueAtTime(80, ctx.currentTime + 1);
      impact.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 1.5);
      impactGain.gain.setValueAtTime(0, ctx.currentTime);
      impactGain.gain.setValueAtTime(0.6, ctx.currentTime + 1);
      impactGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 2);
      impact.start(ctx.currentTime + 1);
      impact.stop(ctx.currentTime + 2);
    }

    // ========== AFRICAN INSPIRED ==========

    function playAfricanDrum() {
      const ctx = getCtx();
      const times = [0, 0.15, 0.3, 0.5, 0.65];
      const freqs = [100, 150, 100, 80, 120];
      
      times.forEach((t, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(freqs[i], ctx.currentTime + t);
        osc.frequency.exponentialRampToValueAtTime(freqs[i] * 0.5, ctx.currentTime + t + 0.15);
        gain.gain.setValueAtTime(0.5, ctx.currentTime + t);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + t + 0.2);
        osc.start(ctx.currentTime + t);
        osc.stop(ctx.currentTime + t + 0.2);
      });

      // Final big hit
      const big = ctx.createOscillator();
      const bigGain = ctx.createGain();
      big.connect(bigGain);
      bigGain.connect(ctx.destination);
      big.frequency.setValueAtTime(60, ctx.currentTime + 0.8);
      big.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 1.5);
      bigGain.gain.setValueAtTime(0.7, ctx.currentTime + 0.8);
      bigGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 2);
      big.start(ctx.currentTime + 0.8);
      big.stop(ctx.currentTime + 2);
    }

    function playKalimba() {
      const ctx = getCtx();
      const notes = [523, 659, 784, 659, 523];
      const times = [0, 0.12, 0.24, 0.36, 0.48];
      
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime + times[i]);
        gain.gain.setValueAtTime(0.4, ctx.currentTime + times[i]);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + times[i] + 0.8);
        osc.start(ctx.currentTime + times[i]);
        osc.stop(ctx.currentTime + times[i] + 0.8);
        
        // Harmonic
        const harm = ctx.createOscillator();
        const harmGain = ctx.createGain();
        harm.connect(harmGain);
        harmGain.connect(ctx.destination);
        harm.type = 'sine';
        harm.frequency.setValueAtTime(freq * 2, ctx.currentTime + times[i]);
        harmGain.gain.setValueAtTime(0.15, ctx.currentTime + times[i]);
        harmGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + times[i] + 0.5);
        harm.start(ctx.currentTime + times[i]);
        harm.stop(ctx.currentTime + times[i] + 0.5);
      });
    }

    function playAfricanChant() {
      const ctx = getCtx();
      // Vocal-like sound using FM synthesis
      const carrier = ctx.createOscillator();
      const modulator = ctx.createOscillator();
      const modGain = ctx.createGain();
      const mainGain = ctx.createGain();
      
      modulator.connect(modGain);
      modGain.connect(carrier.frequency);
      carrier.connect(mainGain);
      mainGain.connect(ctx.destination);
      
      carrier.type = 'sine';
      modulator.type = 'sine';
      carrier.frequency.setValueAtTime(220, ctx.currentTime);
      carrier.frequency.setValueAtTime(260, ctx.currentTime + 0.3);
      carrier.frequency.setValueAtTime(220, ctx.currentTime + 0.6);
      modulator.frequency.setValueAtTime(5, ctx.currentTime);
      modGain.gain.setValueAtTime(30, ctx.currentTime);
      mainGain.gain.setValueAtTime(0.4, ctx.currentTime);
      mainGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.5);
      
      carrier.start(ctx.currentTime);
      modulator.start(ctx.currentTime);
      carrier.stop(ctx.currentTime + 1.5);
      modulator.stop(ctx.currentTime + 1.5);
    }

    function playDjembeDrop() {
      const ctx = getCtx();
      // Djembe hit with reverb-like decay
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.setValueAtTime(150, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.8, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.5);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 1.5);

      // Slap sound
      const slap = ctx.createOscillator();
      const slapGain = ctx.createGain();
      slap.connect(slapGain);
      slapGain.connect(ctx.destination);
      slap.frequency.setValueAtTime(800, ctx.currentTime);
      slap.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.05);
      slapGain.gain.setValueAtTime(0.3, ctx.currentTime);
      slapGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
      slap.start(ctx.currentTime);
      slap.stop(ctx.currentTime + 0.1);
    }

    // ========== MODERN / TECH ==========

    function playSynthWave() {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(110, ctx.currentTime);
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(200, ctx.currentTime);
      filter.frequency.exponentialRampToValueAtTime(2000, ctx.currentTime + 0.5);
      filter.frequency.exponentialRampToValueAtTime(500, ctx.currentTime + 1.5);
      gain.gain.setValueAtTime(0.4, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 2);
      
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 2);
    }

    function playDigitalPulse() {
      const ctx = getCtx();
      // Two pulses like a heartbeat
      [0, 0.2].forEach(t => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(80, ctx.currentTime + t);
        osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + t + 0.15);
        gain.gain.setValueAtTime(0.6, ctx.currentTime + t);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + t + 0.3);
        osc.start(ctx.currentTime + t);
        osc.stop(ctx.currentTime + t + 0.3);
      });

      // Tail resonance
      const tail = ctx.createOscillator();
      const tailGain = ctx.createGain();
      tail.connect(tailGain);
      tailGain.connect(ctx.destination);
      tail.type = 'sine';
      tail.frequency.setValueAtTime(60, ctx.currentTime + 0.4);
      tailGain.gain.setValueAtTime(0.3, ctx.currentTime + 0.4);
      tailGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.5);
      tail.start(ctx.currentTime + 0.4);
      tail.stop(ctx.currentTime + 1.5);
    }

    function playGlitchDrop() {
      const ctx = getCtx();
      // Glitchy stutter
      for (let i = 0; i < 8; i++) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(200 - i * 15, ctx.currentTime + i * 0.05);
        gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.05);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.05 + 0.04);
        osc.start(ctx.currentTime + i * 0.05);
        osc.stop(ctx.currentTime + i * 0.05 + 0.04);
      }

      // Bass drop
      const bass = ctx.createOscillator();
      const bassGain = ctx.createGain();
      bass.connect(bassGain);
      bassGain.connect(ctx.destination);
      bass.frequency.setValueAtTime(80, ctx.currentTime + 0.4);
      bass.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 1);
      bassGain.gain.setValueAtTime(0.7, ctx.currentTime + 0.4);
      bassGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.5);
      bass.start(ctx.currentTime + 0.4);
      bass.stop(ctx.currentTime + 1.5);
    }

    function playWhoosh() {
      const ctx = getCtx();
      // Whoosh sweep
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(50, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(500, ctx.currentTime + 0.3);
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(100, ctx.currentTime);
      filter.frequency.exponentialRampToValueAtTime(2000, ctx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.01, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.4, ctx.currentTime + 0.3);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
      
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.5);

      // Impact
      const impact = ctx.createOscillator();
      const impactGain = ctx.createGain();
      impact.connect(impactGain);
      impactGain.connect(ctx.destination);
      impact.frequency.setValueAtTime(100, ctx.currentTime + 0.3);
      impact.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.8);
      impactGain.gain.setValueAtTime(0.6, ctx.currentTime + 0.3);
      impactGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.2);
      impact.start(ctx.currentTime + 0.3);
      impact.stop(ctx.currentTime + 1.2);
    }

    // ========== MUSICAL ==========

    function playPianoChord() {
      const ctx = getCtx();
      // C major chord with harmonics
      const notes = [261, 329, 392, 523];
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 2);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 2);
      });
    }

    function playOrchestralHit() {
      const ctx = getCtx();
      // Full spectrum hit
      [65, 130, 196, 261, 329, 392].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = i < 2 ? 'sawtooth' : 'triangle';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.5);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 1.5);
      });
    }

    function playBrightChime() {
      const ctx = getCtx();
      const notes = [523, 659, 784, 1047, 1318];
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.08);
        gain.gain.setValueAtTime(0, ctx.currentTime);
        gain.gain.setValueAtTime(0.25, ctx.currentTime + i * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.08 + 1.2);
        osc.start(ctx.currentTime + i * 0.08);
        osc.stop(ctx.currentTime + i * 0.08 + 1.2);
      });
    }

    function playEpicBrass() {
      const ctx = getCtx();
      // Brass fanfare
      const notes = [196, 261, 329];
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.1);
        gain.gain.setValueAtTime(0, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.25, ctx.currentTime + i * 0.1 + 0.05);
        gain.gain.setValueAtTime(0.25, ctx.currentTime + i * 0.1 + 0.3);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.5);
        osc.start(ctx.currentTime + i * 0.1);
        osc.stop(ctx.currentTime + 1.5);
      });
    }

    // ========== MINIMAL ==========

    function playMinimalPop() {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.setValueAtTime(1000, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.05);
      gain.gain.setValueAtTime(0.5, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.2);
    }

    function playSubDrop() {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(60, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(25, ctx.currentTime + 1.5);
      gain.gain.setValueAtTime(0.8, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 2);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 2);
    }

    function playSoftGong() {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(180, ctx.currentTime);
      osc.frequency.setValueAtTime(175, ctx.currentTime + 0.5);
      gain.gain.setValueAtTime(0.5, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 3);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 3);

      // Overtones
      [360, 540].forEach(freq => {
        const h = ctx.createOscillator();
        const hg = ctx.createGain();
        h.connect(hg);
        hg.connect(ctx.destination);
        h.frequency.setValueAtTime(freq, ctx.currentTime);
        hg.gain.setValueAtTime(0.15, ctx.currentTime);
        hg.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 2);
        h.start(ctx.currentTime);
        h.stop(ctx.currentTime + 2);
      });
    }

    function playHeartbeat() {
      const ctx = getCtx();
      // Lub
      const lub = ctx.createOscillator();
      const lubGain = ctx.createGain();
      lub.connect(lubGain);
      lubGain.connect(ctx.destination);
      lub.frequency.setValueAtTime(60, ctx.currentTime);
      lub.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.15);
      lubGain.gain.setValueAtTime(0.6, ctx.currentTime);
      lubGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
      lub.start(ctx.currentTime);
      lub.stop(ctx.currentTime + 0.2);

      // Dub
      const dub = ctx.createOscillator();
      const dubGain = ctx.createGain();
      dub.connect(dubGain);
      dubGain.connect(ctx.destination);
      dub.frequency.setValueAtTime(50, ctx.currentTime + 0.25);
      dub.frequency.exponentialRampToValueAtTime(35, ctx.currentTime + 0.4);
      dubGain.gain.setValueAtTime(0.5, ctx.currentTime + 0.25);
      dubGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
      dub.start(ctx.currentTime + 0.25);
      dub.stop(ctx.currentTime + 0.5);
    }
  </script>
